name: Security audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit.yml
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    paths:
      - .github/workflows/audit.yml
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-audit
      - run: ./admin/cargo-audit.sh
